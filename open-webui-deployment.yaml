---
# Open WebUI — s390x OpenShift Deployment
#
# Apply with:
#   oc apply -f open-webui-deployment.yaml -n spyre-profiling
#
# Prerequisites:
#   - Ollama KServe InferenceService already running in the same namespace
#   - Set OLLAMA_BASE_URL below to the Ollama service URL
#     (internal: http://<inferenceservice-name>-predictor.<namespace>.svc.cluster.local:11434)
#     (external route: https://<route-host>)
#
# Storage: uses spyre-profiling-pvc (team shared NFS PVC, 2 TiB) with subPath
# isolation so each workload writes to its own directory on the shared volume.
# No dedicated PVC is required — an admin pre-provisioned spyre-profiling-pvc.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: spyre-profiling
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: quay.io/justinveltri/open-webui:s390x-v25
          imagePullPolicy: Always
          workingDir: /opt/app-root/src
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec /usr/bin/python3.12 -m uvicorn open_webui.main:app \
                --host "${HOST:-0.0.0.0}" \
                --port "${PORT:-8080}" \
                --forwarded-allow-ips "*" \
                --workers 1
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # ----------------------------------------------------------------
            # Point at the Ollama KServe InferenceService.
            # Use the internal cluster DNS name to avoid the ingress hop.
            # Format: http://<inferenceservice-name>-predictor.<namespace>.svc.cluster.local:11434
            # ----------------------------------------------------------------
            - name: OLLAMA_BASE_URL
              value: "http://ollama-predictor-predictor.spyre-profiling.svc.cluster.local:11434"
            # CPU inference on s390x is slow — extend all timeouts to 30 minutes
            - name: AIOHTTP_CLIENT_TIMEOUT
              value: "1800"
            - name: AIOHTTP_CLIENT_TIMEOUT_OPENAI_MODEL_LIST
              value: "30"
            - name: OLLAMA_REQUEST_TIMEOUT
              value: "1800"
            - name: REQUEST_TIMEOUT
              value: "1800"
            - name: CONTENT_EXTRACTION_ENGINE_TIMEOUT
              value: "1800"
            - name: UVICORN_TIMEOUT_KEEP_ALIVE
              value: "1800"
            # Generate a real secret: python3 -c "import secrets; print(secrets.token_hex(32))"
            - name: WEBUI_SECRET_KEY
              value: "change-me-to-a-real-secret"
            - name: ENV
              value: "prod"
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: DOCKER
              value: "true"
            - name: ENABLE_SIGNUP
              value: "true"
            - name: ENABLE_LOGIN_FORM
              value: "true"
            - name: DEFAULT_USER_ROLE
              value: "admin"
            # Disable RAG/vector store (chromadb removed for s390x compatibility)
            - name: ENABLE_RAG_WEB_SEARCH
              value: "false"
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            - name: ANONYMIZED_TELEMETRY
              value: "false"
            # Disable vector DB — chromadb requires onnxruntime (no s390x wheel)
            # RAG/knowledge features unavailable; chat + Ollama inference work fine
            - name: VECTOR_DB
              value: "disabled"
            # Disable auto title generation — it fires a second concurrent Ollama
            # request which times out while the main chat request is still loading
            # the model (bswap takes ~5 min on s390x CPU cold start).
            - name: ENABLE_TITLE_GENERATION
              value: "false"
            - name: ENABLE_AUTOCOMPLETE_GENERATION
              value: "false"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: webui-data
              mountPath: /opt/app-root/src/data
              subPath: open-webui
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: spyre-profiling-pvc
      # OpenShift will assign an arbitrary UID — image is chown 1001:0 + g=u
      securityContext:
        runAsNonRoot: true

---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: spyre-profiling
  labels:
    app: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
# OpenShift Route — exposes Open WebUI externally with TLS termination
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: open-webui
  namespace: spyre-profiling
  labels:
    app: open-webui
  annotations:
    # HAProxy router timeout — must be longer than the slowest LLM inference
    # request (smollm:135m ~2 min, larger models up to 10+ min on CPU).
    # Default OpenShift route timeout is 30s which kills streaming responses.
    haproxy.router.openshift.io/timeout: 30m
spec:
  to:
    kind: Service
    name: open-webui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
