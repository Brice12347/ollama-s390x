# ollama-route.yaml
#
# Exposes the Ollama inference server externally via an OpenShift edge-TLS Route.
# Points at ollama-predictor-http (the regular ClusterIP service in ollama-svc.yaml),
# NOT the headless KServe-managed service which cannot back a Route.
#
# Apply with:
#   oc apply -f ollama-svc.yaml   -n spyre-profiling
#   oc apply -f ollama-route.yaml -n spyre-profiling
#
# The resulting external URL will be:
#   https://ollama-predictor-spyre-profiling.apps.spyre-test-1.pok.stglabs.ibm.com
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ollama-predictor
  namespace: spyre-profiling
  labels:
    app: ollama-predictor
  annotations:
    # CPU inference on s390x can take minutes for 1.5B+ models.
    # OpenShift's default Route timeout is 30s — raise to match the
    # Open WebUI client timeout in open-webui-deployment.yaml.
    haproxy.router.openshift.io/timeout: 30m
spec:
  to:
    kind: Service
    name: ollama-predictor-http    # regular ClusterIP service — see ollama-svc.yaml
  port:
    targetPort: http1              # named port on the service (11434)
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
